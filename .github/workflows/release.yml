name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A release's own push deploy runs before the tag exists, so it is stamped vX.Y.Z+sha.
  # Redeploy once the tag is there. GITHUB_TOKEN-created tags/releases trigger no
  # workflows, but workflow_dispatch via GITHUB_TOKEN is allowed. If main has moved on by
  # then, the redeploy deploys the newer HEAD, which is not tagged and stays vX.Y.Z+sha.
  redeploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the Pages deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "Release $RELEASE_TAG created; redeploying Pages"
          gh workflow run pages.yml --ref main
