name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # nightly, UTC; scheduled runs use the default branch only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mocked-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install Playwright (dev-only, inside tests/)
        working-directory: tests
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Mocked-API end-to-end checks
        run: node tests/run.mjs
      - name: create-pat.sh checks
        run: bash tests/create-pat.test.sh

  report-failure:
    name: Open issue for failed nightly run
    needs: mocked-tests
    if: ${{ always() && github.event_name == 'schedule' && needs.mocked-tests.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: Nightly tests failed
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$ISSUE_TITLE\")][0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Nightly tests failed again: $RUN_URL"
          else
            gh issue create --title "$ISSUE_TITLE" --body "The scheduled test run failed: $RUN_URL"
          fi
